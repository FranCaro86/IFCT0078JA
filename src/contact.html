<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="copyright" content="private">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Mi Web</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <link href="assets/styles/css-examples.v1.0.css" rel="stylesheet">
</head>

<body>

    <header class="text-white bg-secondary text-center p-3">
        <div class="container">
            <h1 class="mb-1">Contacto</h1>
            <h2 class="h5">Breve descripción</h2>
            <nav class="mt-3">
                <a class="btn btn-outline-light btn-sm me-2" href="./index.html">Inicio</a>
                <a class="btn btn-outline-light btn-sm me-2" href="./cv.html">Currículum V.</a>
                <a class="btn btn-outline-light btn-sm me-2" href="./portfolio.html">Porfolio</a>
                <a class="btn btn-light btn-sm text-dark" href="./contact.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="contacto container mt-2">
        <div class="row justify-content-between">

            <section class="info-contacto col-md-5 mb-4">
                <h2>Información de contacto</h2>
                <p><strong>Correo Electrónico:</strong></p>
                <p><strong>Redes Profesionales:</strong></p>
                <p><strong>Descarga CV:</strong></p>
                <div class="redes">
                    <a href="#">LinkedIn</a> |
                    <a href="#">GitHub</a>
                </div>
            </section>

            <!-- FORMULARIO -->
            <section class="formulario col-md-6">
                <h2>Formulario de contacto</h2>
                <form id="formContacto" action="../app/api/forms/contact.php" enctype="multipart/form-data" novalidate>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre y apellidos:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre"
                            placeholder="Escribe tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico:</label>
                        <input type="email" class="form-control" id="correo" name="correo"
                            placeholder="Escribe tu correo" required>
                    </div>

                    <div class="mb-3">
                        <label for="asunto" class="form-label">Asunto:</label>
                        <input type="text" class="form-control" id="asunto" name="asunto"
                            placeholder="Asunto del mensaje">
                    </div>

                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje:</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" placeholder="Escribe tu mensaje"
                            rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="docfile" class="form-label">Documento (PDF):</label>
                        <input type="file" class="form-control" id="docfile" name="documento" accept=".pdf" required>
                    </div>

                    <!-- Mensaje de estado antes del botón -->
                    <p id="estadoMensaje" class="mt-3"></p>

                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="bg-secondary text-white p-3">
        <div class="container fila-parrafos">
            <p class="izquierda mb-0">© 2025 Fran Caro D.</p>
            <p class="derecha mb-0">Redes Sociales</p>
        </div>
    </footer>

    <!-- Scripts -->

    <script src="./assets/js/custom.v3.1.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous">
        </script>

</body>

</html>
